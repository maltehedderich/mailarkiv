min_version = "2026.11.2"

[settings]
lockfile = true

[tools]
go = "1.27"
bun = "1.4"
node = "26"
"go:honnef.co/go/tools/cmd/staticcheck" = "2026.2.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
rust = { version = "1.100.0", targets = "x86_64-unknown-linux-musl,aarch64-unknown-linux-musl", profile = "minimal", components = "rustfmt,clippy" }
"cargo:cargo-audit" = "0.23.0"

[vars]
# The search program is a static musl binary on Linux. On macOS, where
# MailArkiv is only developed, it builds for the Mac.
search_target = "{% if arch() == 'arm64' %}aarch64{% else %}x86_64{% endif %}-{% if os() == 'linux' %}unknown-linux-musl{% else %}apple-darwin{% endif %}"
# The Linux container for macOS. The checkout is mounted at /work. Builds,
# dependencies, and tools live in volumes, so no Linux file reaches the Mac's
# checkout. --init reaps the processes that tests orphan.
linux_run = """docker run --rm --init \
  --mount type=bind,src="$PWD",dst=/work \
  --mount type=volume,src=mailarkiv-linux-home,dst=/home/ubuntu \
  --mount type=volume,src=mailarkiv-linux-bin,dst=/work/bin \
  --mount type=volume,src=mailarkiv-linux-node-modules,dst=/work/frontend/node_modules \
  --mount type=volume,src=mailarkiv-linux-target,dst=/work/mailarkiv-search/target"""

[tasks.setup]
description = "Install project dependencies from the lockfiles"
run = [
  # On Linux, mimalloc's C code in the search program builds with musl-gcc.
  "if [ \"$(uname -s)\" = Linux ] && ! command -v musl-gcc >/dev/null; then echo 'Install musl-gcc: sudo apt-get install musl-tools' >&2; exit 1; fi",
  "cd frontend && bun install --frozen-lockfile && bunx playwright install chromium",
  "go mod download",
  "cd mailarkiv-search && cargo fetch --locked",
]

[tasks."frontend:build"]
description = "Build the web interface"
dir = "frontend"
run = "bun run build"

# CGO_ENABLED=0 stays on this task only, because `go test -race` needs cgo.
[tasks."server:build"]
description = "Build the server binary with the embedded interface"
depends = ["frontend:build"]
env = { CGO_ENABLED = "0" }
run = "go build -o bin/mailarkiv ./cmd/mailarkiv"

# The server looks for the search program beside its own executable.
[tasks."search:build"]
description = "Build the search program, as a static binary on Linux"
dir = "mailarkiv-search"
run = [
  "cargo build --release --locked --target {{vars.search_target}}",
  "mkdir -p ../bin && cp target/{{vars.search_target}}/release/mailarkiv-search ../bin/mailarkiv-search",
]

[tasks."search:build:faults"]
description = "Build the search program with fault points for the process tests"
dir = "mailarkiv-search"
run = [
  "cargo build --locked --features faults --target {{vars.search_target}}",
  "mkdir -p ../bin/faults && cp target/{{vars.search_target}}/debug/mailarkiv-search ../bin/faults/mailarkiv-search",
]

[tasks.build]
description = "Build the web interface, the server binary, and the search program"
depends = ["frontend:build", "server:build", "search:build"]

[tasks.dev]
description = "Run the server and the frontend dev server with reload"
depends = ["frontend:build"]
run = [{ tasks = ["dev:server", "dev:frontend"] }]

# A built binary instead of `go run`, so the search program sits beside it.
[tasks."dev:server"]
description = "Run the server against the local development data"
hide = true
depends = ["server:build", "search:build"]
run = [
  "mkdir -p .data",
  "if [ ! -e .data/mailarkiv.key ]; then bin/mailarkiv key create --data-dir .data/dev .data/mailarkiv.key; fi",
  '''
  if [ -z "${SSL_CERT_FILE:-}" ] && [ -f .data/ca.pem ]; then
    export SSL_CERT_FILE="$PWD/.data/ca.pem"
  fi
  exec bin/mailarkiv serve --data-dir .data/dev --key-file .data/mailarkiv.key
  ''',
]

[tasks."dev:frontend"]
description = "Run the frontend dev server"
hide = true
dir = "frontend"
run = "bun run dev"

# `go run` compiles the embedded interface, so it needs a frontend build.
[tasks."dev:account"]
description = "Create an account in the local development data"
depends = ["frontend:build"]
interactive = true
usage = 'arg "<email>" help="Email address to sign in with"'
run = 'go run ./cmd/mailarkiv account create --data-dir .data/dev "$usage_email"'

[tasks.lint]
description = "Run read-only static checks"
depends = ["frontend:build"]
run = [
  # Bare `gofmt -l` always exits 0, and `.` would walk frontend/node_modules.
  'test -z "$(gofmt -l cmd internal frontend/embed.go)"',
  "go vet ./...",
  "staticcheck ./...",
  "cd frontend && bunx prettier --check .",
  "cd mailarkiv-search && cargo fmt --check",
  "cd mailarkiv-search && cargo clippy --locked --all-targets -- -D warnings",
  "cd mailarkiv-search && cargo clippy --locked --all-targets --features faults -- -D warnings",
]

[tasks.format]
description = "Format Go, frontend, and Rust files"
run = [
  "gofmt -w cmd internal frontend/embed.go",
  "cd frontend && bunx prettier --write .",
  "cd mailarkiv-search && cargo fmt",
]

[tasks.typecheck]
description = "Type-check the frontend"
depends = ["frontend:build"]
dir = "frontend"
run = ["bunx svelte-kit sync", "bunx svelte-check --fail-on-warnings"]

[tasks.audit]
description = "Scan Go, frontend, and Rust dependencies for known vulnerabilities"
depends = ["frontend:build"]
run = [
  "govulncheck ./...",
  # deepmerge only merges trusted Vite options at build time and isn't bundled.
  # Remove this exception when a fixed version ships or the plugin drops it.
  "cd frontend && bun audit --ignore=GHSA-gcqx-w48m-w2h4",
  "cd mailarkiv-search && cargo audit",
]

# Go tests start the search program from bin/ and bin/faults/.
[tasks."server:test"]
description = "Run the Go tests with the race detector"
depends = ["frontend:build", "search:build", "search:build:faults"]
run = "go test -race ./..."

[tasks."search:test"]
description = "Run the search program's tests, with and without fault points"
dir = "mailarkiv-search"
run = ["cargo test --locked", "cargo test --locked --features faults"]

[tasks."frontend:test"]
description = "Run the frontend unit tests"
depends = ["frontend:build"]
dir = "frontend"
env = { TZ = "Europe/Berlin" }
run = "bunx vitest run"

[tasks."test:e2e"]
description = "Run the browser tests against the built binary and the test IMAP server"
depends = ["build"]
run = [
  "go build -o bin/imaptestserver ./internal/imaptest/cmd/imaptestserver",
  "cd frontend && bunx playwright test",
]

[tasks.test]
description = "Run the full test suite"
depends = ["search:test", "server:test", "frontend:test", "test:e2e"]

# CI splits these tasks across runners in .github/workflows/check.yml. A task
# added here must be added to a part there too.
[tasks.check]
description = "Run everything CI gates on"
depends = ["lint", "typecheck", "test", "audit"]

[tasks."linux:build"]
description = "Build the image that linux:check and linux:shell run in"
hide = true
run = "docker build --tag mailarkiv-linux --file dev/linux/Dockerfile ."

# One task at a time: run together on one machine, the suites slow each other
# down until timing-bound tests fail. CI gives each part its own runner.
[tasks."linux:check"]
description = "Run the checks on Linux in a container, from macOS"
depends = ["linux:build"]
run = "{{vars.linux_run}} mailarkiv-linux bash -c 'mise install && mise run setup && mise run --jobs 1 check'"

[tasks."linux:shell"]
description = "Open a shell on Linux in a container, from macOS"
depends = ["linux:build"]
interactive = true
run = "{{vars.linux_run}} --interactive --tty mailarkiv-linux bash"

[tasks.clean]
description = "Delete generated files, and never the data in .data/"
run = "rm -rf bin frontend/build frontend/.svelte-kit mailarkiv-search/target"
