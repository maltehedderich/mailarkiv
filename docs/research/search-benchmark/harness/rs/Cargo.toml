[package]
name = "tspike"
version = "0.0.0"
edition = "2021"

[dependencies]
tantivy = { version = "=0.26.1", default-features = false, features = ["mmap", "lz4-compression"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[features]
mi = ["dep:mimalloc"]

[dependencies.mimalloc]
version = "0.1"
optional = true
default-features = false
