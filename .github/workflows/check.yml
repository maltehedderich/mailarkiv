name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      # musl-tools gives musl-gcc, which builds the search program's C code.
      - name: Install strace and musl-tools
        run: sudo apt-get update && sudo apt-get install --yes strace musl-tools
      - name: Cache Go builds and modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-
      # mise leaves CARGO_HOME at its default, ~/.cargo.
      - name: Cache the cargo registry and search program builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            mailarkiv-search/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'mailarkiv-search/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.lock', 'mailarkiv-search/Cargo.lock') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run setup
      - name: Install the browser's system libraries
        working-directory: frontend
        run: bunx playwright install-deps chromium
      - run: mise run check
